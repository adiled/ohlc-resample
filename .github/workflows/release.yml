# Release workflow.
#
# Fires on every push to `main`. The decision to release is driven entirely by
# what's in `.changeset/`:
#
#   - If pending `.changeset/*.md` files exist, the workflow runs the changesets
#     CLI to bump `package.json#version`, regenerate `CHANGELOG.md`, and delete
#     the consumed changeset files. It commits and pushes those changes to main
#     (with `[skip ci]` so the bot's own commit doesn't re-trigger this workflow),
#     then publishes to npm with provenance, tags `vX.Y.Z`, creates a matching
#     GitHub Release, builds standalone CLI binaries for every supported
#     platform via `bun build --compile`, and uploads them as release assets so
#     `install.sh` can fetch them.
#
#   - If there are no pending changesets, the workflow exits cleanly. Nothing
#     to release.
#
# All of this happens in a single workflow run from one push to main.
#
# One-time setup:
#   - In repo Settings → Secrets and variables → Actions, add `NPM_TOKEN`
#     (an npm "Granular Access Token" with read+write on this package).

name: Release

on:
  push:
    branches: [main]

# Prevent two release runs from racing each other.
concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # push the bump commit + tag, create GH Release
      id-token: write          # npm provenance (OIDC)
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # full history; changesets needs it

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm test

      - name: Apply pending changesets and publish
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          # Consume any pending changesets — bumps version, updates CHANGELOG,
          # deletes the consumed .changeset/*.md files. No-op if none pending.
          pnpm changeset version

          if [[ -z $(git status --porcelain) ]]; then
            echo "No pending changesets — nothing to release."
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          git commit -m "chore(release): ${TAG} [skip ci]"
          git push origin HEAD:main

          # Publish first so a push success + publish failure doesn't leave a
          # phantom version on main. (npm rejects duplicate versions, so a
          # retried run is safe.)
          pnpm publish --no-git-checks --access public --provenance

          git tag "${TAG}"
          git push origin "${TAG}"

          # Extract the just-prepended CHANGELOG entry (everything between the
          # first `## ` heading and the next one, minus the heading itself) and
          # use it as the GitHub Release body.
          awk '/^## /{i++} i==1' CHANGELOG.md | tail -n +2 > /tmp/release-notes.md
          gh release create "${TAG}" \
            --title "${TAG}" \
            --notes-file /tmp/release-notes.md

          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  # Build standalone CLI binaries (no Node required at install time) and
  # attach them to the GH Release. Runs only when the previous job actually
  # released. Each platform builds natively via bun-compile.
  binaries:
    needs: release
    if: needs.release.outputs.released == 'true'
    permissions:
      contents: write          # upload release assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-14,        target: bun-darwin-arm64,  asset: ohlc-darwin-arm64 }
          - { runner: macos-13,        target: bun-darwin-x64,    asset: ohlc-darwin-x64 }
          - { runner: ubuntu-24.04,    target: bun-linux-x64,     asset: ohlc-linux-x64 }
          - { runner: ubuntu-24.04-arm,target: bun-linux-arm64,   asset: ohlc-linux-arm64 }
          - { runner: windows-2022,    target: bun-windows-x64,   asset: ohlc-windows-x64.exe }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # use the post-release commit so we bundle the bumped version

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Compile binary
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun build --compile --target=${{ matrix.target }} src/cli.ts --outfile ${{ matrix.asset }}
          ls -lh ${{ matrix.asset }}

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release upload "${{ needs.release.outputs.tag }}" "${{ matrix.asset }}" --clobber
