# Release workflow.
#
# Fires on every push to `main`. PR-based Changesets flow:
#
#   - If pending `.changeset/*.md` files exist, the workflow applies the
#     version bump / CHANGELOG update on a branch and opens a "Version
#     Packages" PR. Nothing is published yet.
#
#   - When that PR is merged (push to `main` with no pending changesets),
#     the workflow publishes to npm with provenance, tags `vX.Y.Z`, and
#     creates a matching GitHub Release. If the version is already published
#     (an unrelated push), it exits cleanly.
#
# `main` is branch-protected (PR required), so the bump is never pushed
# straight to `main` — it always goes through a PR.
#
# The npm tarball is the only release artifact. `install.sh` (run client-side
# by users) handles platform-specific work, including bringing a Node runtime
# along when the user doesn't have one. No per-platform binaries are built or
# uploaded.
#
# One-time setup:
#   - In repo Settings → Secrets and variables → Actions, add `NPM_TOKEN`
#     (an npm "Granular Access Token" with read+write on this package).

name: Release

on:
  push:
    branches: [main]

# Prevent two release runs from racing each other.
concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # push the Version Packages branch + tag, create GH Release
      pull-requests: write     # open/update the Version Packages PR
      id-token: write          # npm provenance (OIDC)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # full history; changesets needs it

      - uses: actions/setup-node@v4
        with:
          node-version: 26.x
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Apply pending changesets
        id: apply
        env:
          # @changesets/changelog-github reads process.env.GITHUB_TOKEN to
          # resolve PR/author links; pass the built-in auto token under that name.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Consume any pending changesets — bumps version, updates CHANGELOG,
          # deletes the consumed .changeset/*.md files. No-op if none pending.
          # `npx` (not bare `changeset`) so node_modules/.bin is resolved — npm
          # doesn't add it to PATH in GH Actions the way pnpm's action does.
          npx changeset version

          if [[ -n $(git status --porcelain) ]]; then
            echo "has_changes=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Open Version Packages PR
        if: steps.apply.outputs.has_changes == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git checkout -B changeset-release/main
          git add -A
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git commit -m "Version Packages"
          git push origin changeset-release/main --force

          if gh pr list --head changeset-release/main --json number | grep -q '"number"'; then
            gh pr edit changeset-release/main \
              --title "Version Packages" \
              --body "This PR was opened by the release workflow. It applies any pending changesets (version bumps, CHANGELOG updates) and deletes the consumed \`.changeset/*.md\` files. Merging it triggers the npm publish + tag + GitHub Release."
          else
            gh pr create \
              --base main \
              --head changeset-release/main \
              --title "Version Packages" \
              --body "This PR was opened by the release workflow. It applies any pending changesets (version bumps, CHANGELOG updates) and deletes the consumed \`.changeset/*.md\` files. Merging it triggers the npm publish + tag + GitHub Release."
          fi

      - name: Publish
        if: steps.apply.outputs.has_changes != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          LOCAL=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view ohlc-resample@latest version 2>/dev/null || echo "")
          if [[ -n "$PUBLISHED" && "$LOCAL" == "$PUBLISHED" ]]; then
            echo "Version ${LOCAL} already published — nothing to do."
            exit 0
          fi

          TAG="v${LOCAL}"

          # Publish first so a tag/release failure doesn't leave a phantom
          # version. (npm rejects duplicate versions, so a retried run is safe.)
          npm publish --no-git-checks --access public --provenance

          git tag "${TAG}"
          git push origin "${TAG}"

          # Extract the just-prepended CHANGELOG entry (everything between the
          # first `## ` heading and the next one, minus the heading itself) and
          # use it as the GitHub Release body.
          awk '/^## /{i++} i==1' CHANGELOG.md | tail -n +2 > /tmp/release-notes.md
          gh release create "${TAG}" \
            --title "${TAG}" \
            --notes-file /tmp/release-notes.md
